[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "holmes"
version = "0.0.1"
authors = [
  { name = "MohammadHosein Mozafari", email = "Mohammad.hosein.mozafaryk@gmail.com" },
]
description = "Tools for investigating datasets and models."
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "matplotlib>=3.5",
    "numpy>=1.21",
    "pandas>=1.3",
    "scikit-learn>=1.3",
    "scipy>=1.7",
]

[tool.setuptools.packages.find]
include = ["holmes*", "core*"]
exclude = ["tests*"]

        [tool.black] # Black formatter config
        line-length = 88

        [tool.isort] # isort config
        profile = "black"
        line_length = 88

        [tool.flake8] # Flake8 linter config
        max-line-length = 88
        ignore = "E203, W503" # Common ignores

        [tool.mypy] # Mypy type checker config
        python_version = "3.8"
        exclude = [".git", "__pycache__", "build", "dist", "tests/"]
